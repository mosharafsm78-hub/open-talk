name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms android --org com.opentalk --project-name open_talk --no-pub .
          fi
          rm -rf test
          python3 tool/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: Raise compileSdk of older plugins
        run: |
          for f in $(find "$PUB_CACHE/hosted" -path '*/android/build.gradle*' 2>/dev/null); do
            sed -i -E 's/compileSdkVersion[ (]+[0-9]+\)?/compileSdkVersion 36/; s/compileSdk[ =]+[0-9]+/compileSdk = 36/' "$f"
          done
          ls "$PUB_CACHE/hosted"
          grep -rn "compileSdk" "$PUB_CACHE"/hosted/*/agora_rtc_engine-*/android/ || true
          head -20 android/build.gradle.kts

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --no-shrink --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: open-talk-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Show what is inside the APK
        run: |
          unzip -lv build/app/outputs/flutter-apk/app-release.apk | sort -k1 -n -r | head -25
          ls -la build/app/outputs/flutter-apk/app-release.apk

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate + patch Android project (x86_64 for the emulator)
        env:
          OT_ABI: x86_64
        run: |
          if [ ! -d android ]; then
            flutter create --platforms android --org com.opentalk --project-name open_talk --no-pub .
          fi
          rm -rf test
          python3 tool/patch_android.py
      - run: flutter pub get
      - name: Raise compileSdk of older plugins
        run: |
          for f in $(find "$PUB_CACHE/hosted" -path '*/android/build.gradle*' 2>/dev/null); do
            sed -i -E 's/compileSdkVersion[ (]+[0-9]+\)?/compileSdkVersion 36/; s/compileSdk[ =]+[0-9]+/compileSdk = 36/' "$f"
          done
      - name: Build x86_64 APK
        run: flutter build apk --release --no-shrink --target-platform android-x64
      - name: Show merged manifest
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk | grep -E "APPLICATION_ID|uses-permission|minSdk|name=" | head -60
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator and capture log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            echo "=== WAKE_LOCK permission (needed for screen-off near the ear) ==="
            adb shell dumpsys package com.opentalk.open_talk | grep -E "android.permission.WAKE_LOCK" || { echo "WAKE_LOCK MISSING"; exit 1; }
            adb logcat -c
            adb shell monkey -p com.opentalk.open_talk -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > launch.log || true
            echo "=== process alive? ==="
            adb shell pidof com.opentalk.open_talk || echo "NOT RUNNING"
            adb shell pidof com.opentalk.open_talk > /dev/null || { grep -E "FATAL EXCEPTION" -A12 launch.log | head -40; exit 1; }
            echo "=== fatal / errors ==="
            grep -E "FATAL|AndroidRuntime|Process .* has died|MobileAds|ads" launch.log | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-log
          path: launch.log

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: open-talk-apk
      - name: Publish tested APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app-release.apk open-talk.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest open-talk.apk --title "Open Talk (latest tested build)" --notes "Built and launch-tested automatically. Install open-talk.apk on an Android phone." --prerelease
