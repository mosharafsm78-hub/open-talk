name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first run only)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms android --org com.opentalk --project-name open_talk --no-pub .
          fi
          rm -rf test
          python3 tool/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: Raise compileSdk of older plugins
        run: |
          for f in $(find "$PUB_CACHE/hosted" -path '*/android/build.gradle*' 2>/dev/null); do
            sed -i -E 's/compileSdkVersion[ (]+[0-9]+\)?/compileSdkVersion 36/; s/compileSdk[ =]+[0-9]+/compileSdk = 36/' "$f"
          done
          ls "$PUB_CACHE/hosted"
          grep -rn "compileSdk" "$PUB_CACHE"/hosted/*/agora_rtc_engine-*/android/ || true
          head -20 android/build.gradle.kts

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: open-talk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
