name: Validate Open Talk
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f manifest.json
          test -f netlify.toml
          test -f supabase/schema.sql
          test -f privacy.html
          test -f terms.html
          test -f child-safety.html
          test -f delete-account.html
      - run: node --check app.js
      - name: Public pages must have a real contact email
        run: |
          if grep -l OPEN_TALK_CONTACT_EMAIL *.html; then
            echo "::error::Replace OPEN_TALK_CONTACT_EMAIL with the public contact email before merging."
            exit 1
          fi
