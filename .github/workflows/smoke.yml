name: Smoke test (emulator)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate + patch Android project (x86_64 for the emulator)
        env:
          OT_ABI: x86_64
        run: |
          if [ ! -d android ]; then
            flutter create --platforms android --org com.opentalk --project-name open_talk --no-pub .
          fi
          rm -rf test
          python3 tool/patch_android.py
      - run: flutter pub get
      - name: Raise compileSdk of older plugins
        run: |
          for f in $(find "$PUB_CACHE/hosted" -path '*/android/build.gradle*' 2>/dev/null); do
            sed -i -E 's/compileSdkVersion[ (]+[0-9]+\)?/compileSdkVersion 36/; s/compileSdk[ =]+[0-9]+/compileSdk = 36/' "$f"
          done
      - name: Build x86_64 APK
        run: flutter build apk --release --no-shrink --target-platform android-x64
      - name: Show merged manifest
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump xmltree --file AndroidManifest.xml build/app/outputs/flutter-apk/app-release.apk | grep -E "APPLICATION_ID|uses-permission|minSdk|name=" | head -60
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on emulator and capture log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.opentalk.open_talk -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > launch.log || true
            echo "=== process alive? ==="
            adb shell pidof com.opentalk.open_talk || echo "NOT RUNNING"
            adb shell pidof com.opentalk.open_talk > /dev/null || { grep -E "FATAL EXCEPTION" -A12 launch.log | head -40; exit 1; }
            echo "=== fatal / errors ==="
            grep -E "FATAL|AndroidRuntime|Process .* has died|MobileAds|ads" launch.log | head -60 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-log
          path: launch.log
