name: Play Store release bundle

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate + patch Android project (signed, arm64 + arm32)
        env:
          OT_ABI: arm64-v8a,armeabi-v7a
          OT_SIGN: "1"
        run: |
          if [ ! -d android ]; then
            flutter create --platforms android --org com.opentalk --project-name open_talk --no-pub .
          fi
          rm -rf test
          python3 tool/patch_android.py

      - name: Upload signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - run: flutter pub get
      - name: Raise compileSdk of older plugins
        run: |
          for f in $(find "$PUB_CACHE/hosted" -path '*/android/build.gradle*' 2>/dev/null); do
            sed -i -E 's/compileSdkVersion[ (]+[0-9]+\)?/compileSdkVersion 36/; s/compileSdk[ =]+[0-9]+/compileSdk = 36/' "$f"
          done
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build signed app bundle
        run: flutter build appbundle --release --target-platform android-arm,android-arm64 --build-number=${{ github.run_number }}

      - name: Show bundle
        run: |
          ls -la build/app/outputs/bundle/release/
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | head -8

      - name: Publish bundle to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/bundle/release/app-release.aab open-talk.aab
          gh release delete play-bundle -y --cleanup-tag || true
          gh release create play-bundle open-talk.aab --title "Open Talk (Play Store bundle)" --notes "Signed app bundle for Google Play Console. Do not install on a phone." --prerelease
