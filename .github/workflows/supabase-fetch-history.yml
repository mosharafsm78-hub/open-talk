name: Supabase fetch migration history (one-time)

on:
  # Runs once when this file lands on main. Read-only on the database.
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-fetch-history.yml'
      - '.github/scripts/fetch-history-pr.sh'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: supabase-fetch-history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check required secrets
        id: preflight
        run: |
          missing=""
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            [ -n "${!n:-}" ] || missing="$missing $n"
          done
          missing="${missing# }"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          [ -z "$missing" ] || echo "::error::Missing secrets: $missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # needed to push the branch

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        if: steps.preflight.outputs.missing == ''
        with:
          version: 2.119.0

      # Read-only: `link` talks to the Supabase API and `migration fetch` only
      # SELECTs from supabase_migrations.schema_migrations. It runs in a scratch
      # directory so it cannot overwrite or delete anything in the repo.
      - name: Fetch remote migration history (read-only)
        id: fetch
        if: steps.preflight.outputs.missing == ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fetch/supabase"
          cp supabase/config.toml "$RUNNER_TEMP/fetch/supabase/config.toml"
          cd "$RUNNER_TEMP/fetch"
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration fetch --linked --yes
          ls supabase/migrations

      - name: Add new files and open a draft pull request
        id: pr
        if: steps.preflight.outputs.missing == ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/fetch-history-pr.sh "$RUNNER_TEMP/fetch/supabase/migrations"

      # Result goes to a public issue: file names, secret NAMES and links only.
      - name: Report result in a GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MISSING: ${{ steps.preflight.outputs.missing }}
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/issue-body.md"
          if [ -n "$MISSING" ]; then
            echo "⚠️ **Not run — missing secret(s):** \`${MISSING// /\`, \`}\`" > "$body"
          elif [ "$FETCH_OUTCOME" != success ]; then
            echo "❌ **Failed** at: fetch migration history" > "$body"
          elif [ ! -s "$body" ]; then
            echo "❌ **Failed** at: add files and open pull request" > "$body"
          fi
          {
            echo
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$body"
          .github/scripts/post-issue.sh "Supabase migration history fetch" "$body"

      - name: Fail the run if secrets are missing
        if: steps.preflight.outputs.missing != ''
        run: exit 1
