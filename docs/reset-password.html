<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Talk - Reset password</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7fb;margin:0;padding:24px;color:#0f1a3c}
  .card{max-width:420px;margin:40px auto;background:#fff;border-radius:16px;padding:28px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
  h1{font-size:24px;margin:0 0 8px}
  p{color:#555;line-height:1.5}
  input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #cfd4e3;border-radius:12px;font-size:16px;margin:8px 0}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#2f5be7;color:#fff;font-size:16px;font-weight:600;margin-top:8px}
  button:disabled{opacity:.6}
  #msg{margin-top:14px;font-weight:600}
  .ok{color:#127a3d}.err{color:#b3261e}
</style>
</head>
<body>
<div class="card">
  <h1>Reset your password</h1>
  <p id="intro">Choose a new password for your Open Talk account.</p>
  <form id="f" hidden>
    <input id="p1" type="password" placeholder="New password (min 6 characters)" minlength="6" autocomplete="new-password" required>
    <input id="p2" type="password" placeholder="Confirm new password" minlength="6" autocomplete="new-password" required>
    <button id="b" type="submit">Save new password</button>
  </form>
  <div id="msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  const sb = supabase.createClient(
    "https://pmyfswozvkdpqgnsiibf.supabase.co",
    "sb_publishable_RrciEiRwRPkbU6yO6wt8Zg_BI0tSYEW"
  );
  const f = document.getElementById("f"), msg = document.getElementById("msg"), intro = document.getElementById("intro");
  function say(t, ok){ msg.textContent = t; msg.className = ok ? "ok" : "err"; }

  const hash = new URLSearchParams(location.hash.slice(1));
  if (hash.get("error_description")) {
    intro.textContent = "";
    say(hash.get("error_description").replace(/\+/g, " ") + ". Please request a new reset email in the app.", false);
  } else {
    sb.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") f.hidden = false;
    });
    setTimeout(async () => {
      const { data } = await sb.auth.getSession();
      if (data.session) f.hidden = false;
      else if (f.hidden) say("This reset link is invalid or has expired. Please request a new one in the app.", false);
    }, 1500);
  }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    const a = document.getElementById("p1").value, c = document.getElementById("p2").value;
    if (a !== c) return say("Passwords do not match.", false);
    document.getElementById("b").disabled = true;
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { document.getElementById("b").disabled = false; return say(error.message, false); }
    f.hidden = true; intro.textContent = "";
    say("Password updated. Open the Open Talk app and log in with your new password.", true);
    await sb.auth.signOut();
  });
</script>
</body>
</html>
