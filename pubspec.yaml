name: open_talk
description: Open Talk - learn English by talking with real people.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  agora_rtc_engine: ^6.5.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  proximity_sensor: ^1.3.0
  wakelock_plus: ^1.2.8
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2F5BEA"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 24
