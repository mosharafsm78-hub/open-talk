project_id = "open-talk"

# The deploy workflow compares this value with the function's LIVE setting
# before every deploy and refuses to deploy if they differ, so a redeploy can
# never change how a function authenticates.
#
# Verified against production on 2026-10-07: `match` has verify_jwt = true.
[functions.match]
verify_jwt = true

# Permanent account deletion. Requires a signed-in user.
[functions.delete-account]
verify_jwt = true

[functions.turn-credentials]
verify_jwt = true
